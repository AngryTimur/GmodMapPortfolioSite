<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Портфолио.">
  <title>AT Hammer Editor Портфолио</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header class="site-header">
    <a class="brand" href="#" aria-label="Hammer Editor Portfolio">
      <span class="brand-mark">H</span>
      <span class="brand-copy">
        <strong>AT</strong>
        <small>Hammer Editor Портфолио</small>
      </span>
    </a>
    <div class="header-meta">
      <span class="status-dot"></span>
      <span>Карты на SOURCE ENGINE</span>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="eyebrow">Портфолио 2021 - 2026</div>
      <h1>Работы в <span>Hammer Editor.</span></h1>
    </section>

    <section class="portfolio-toolbar" aria-label="Фильтр работ">
      <div id="categories" class="categories"></div>
      <div class="toolbar-info">
        <span id="resultCount">0 работ</span>
        <button id="sortToggle" class="sort-button" type="button" aria-label="Изменить порядок сортировки">
          <span>Новые</span><span class="sort-arrow">↓</span>
        </button>
      </div>
    </section>

    <section id="projectsGrid" class="projects-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden>
      <span>ПРОЕКТЫ НЕ НАЙДЕНЫ</span>
      <p>В этой категории пока нет добавленных работ.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <strong>Portfolio / Hammer Editor</strong>
      <span>© <span id="year"></span></span>
    </div>
    <nav id="socialLinks" aria-label="Социальные ссылки"></nav>
    <a id="donateLink" class="donate" href="#" target="_blank" rel="noopener">♥ ПОДДЕРЖАТЬ</a>
  </footer>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close-modal aria-label="Закрыть">×</button>
      <div class="modal-main-image-wrap">
        <img id="modalMainImage" class="modal-main-image" alt="">
      </div>
      <div class="modal-content">
        <div class="modal-kicker" id="modalCategory"></div>
        <h2 id="modalTitle"></h2>
        <div class="modal-year" id="modalYear"></div>
        <p id="modalDescription"></p>
        <div id="modalTags" class="tags"></div>
        <div class="gallery-heading">
          <span>ГАЛЕРЕЯ</span>
          <span id="galleryCount"></span>
        </div>
        <div id="modalGallery" class="gallery"></div>
        <div class="modal-actions">
          <a id="workshopButton" class="primary-button" href="#" target="_blank" rel="noopener">STEAM WORKSHOP →</a>
          <span id="projectStatus" class="status-label"></span>
        </div>
      </div>
    </article>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Закрыть">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script src="js/categories.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
